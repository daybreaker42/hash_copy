<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 반응형 설정 (W3C 가이드라인 기반) -->
    <title>SHA1 Hash App</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f0f0f0; } /* 모바일 친화적 Flexbox 레이아웃 */
        input, button { margin: 10px; padding: 10px; font-size: 16px; } /* 터치 친화적 크기 (모바일 표준) */
        button { background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #currentNum { font-size: 24px; margin: 20px; } /* ...existing code... */
        #message { margin-top: 20px; font-size: 16px; color: green; transition: outline 0.5s ease-out; } /* 수정: outline 전환 추가 */
        #message.updated.success { outline: 2px solid green; animation: fadeOutline 2s ease-out forwards; } /* 수정: 성공 시 초록 outline */
        #message.updated.failure { outline: 2px solid red; animation: fadeOutline 2s ease-out forwards; } /* 수정: 실패 시 빨강 outline */
        @keyframes fadeOutline { to { outline-color: transparent; } } /* 수정: outline fade-out 애니메이션 (MDN 기반) */

        #controls { display: flex; align-items: center; } /* 숫자 조절 버튼과 현재 숫자 표시를 가로로 배치 */
        #controls button { width: 40px; height: 40px; font-size: 24px; line-height: 24px; text-align: center; padding: 0; } /* 버튼 크기 및 스타일 */
    </style>
</head>
<body>
    <h1>SHA1 Hash Generator</h1>
    <label for="prefix">선행 문자열:</label>
    <input type="text" id="prefix" value="prefix" placeholder="예: prefix"> <!-- 선행 문자열 입력 필드 -->
    <div id="controls">
        <button id="decreaseBtn">-</button> <!-- 숫자 내리기 버튼 -->
        <div id="currentNum">1</div> <!-- 현재 숫자 표시 -->
        <button id="increaseBtn">+</button> <!-- 숫자 올리기 버튼 -->
    </div>
    <button id="copyBtn">해시 복사</button> <!-- 해시 복사 버튼 -->
    <div id="message"></div> <!-- 수정: 메시지 표시 칸 추가 -->
    <script>
        let currentNum = 1; // 현재 숫자 초기화 (startNum=1)
        const prefixInput = document.getElementById('prefix');
        const currentNumDisplay = document.getElementById('currentNum');
        const copyBtn = document.getElementById('copyBtn');
        const decreaseBtn = document.getElementById('decreaseBtn');
        const increaseBtn = document.getElementById('increaseBtn');
            const messageDiv = document.getElementById('message'); // 수정: 메시지 div 참조 추가
            let animationTimeout; // 수정: 애니메이션 setTimeout ID 저장 변수 추가

            // 페이지 로드 시 localStorage에서 선행 문자열 불러오기 (MDN 기반)
            const savedPrefix = localStorage.getItem('prefix'); // 수정: localStorage에서 'prefix' 키 값 불러오기
            if (savedPrefix) {
                prefixInput.value = savedPrefix; // 수정: 불러온 값으로 input 설정
            }

            // 선행 문자열 변경 시 localStorage에 저장
            prefixInput.addEventListener('input', () => {
                localStorage.setItem('prefix', prefixInput.value); // 수정: 입력 시 localStorage에 저장
            });

        // SHA1 해시 계산 함수 (crypto API 사용, MDN 문서 기반)
        async function generateSHA1(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-1', data); // SHA1 해시 생성 (비동기)
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join(''); // 16진수 문자열 반환 (길이: 40자리)
        }

            // 클립보드 복사 함수 (iOS 호환성 추가: execCommand fallback)
            async function copyToClipboard(text) {
                try {
                    await navigator.clipboard.writeText(text); // 우선 클립보드 API 시도
                    return true;
                } catch (err) {
                    // iOS Safari 등에서 실패 시 execCommand 사용 (Apple Developer Docs 기반)
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    const success = document.execCommand('copy'); // 텍스트 선택 후 복사
                    document.body.removeChild(textArea);
                    return success;
                }
            }

            // 해시 복사 함수 (즉시 실행)
        copyBtn.addEventListener('click', async () => {
            const prefix = prefixInput.value;
            const hash = await generateSHA1(currentNum.toString()); // 숫자를 문자열로 해시
            const fullString = prefix + hash.substring(0, 6); // 선행 문자열 + 해시 앞 6자리 결합
            const success = await copyToClipboard(fullString); // 수정: iOS 호환 클립보드 함수 사용
            if (success) {
                messageDiv.innerText = '복사됨: ' + fullString; // 수정: alert 대신 메시지 표시
                currentNum++; // 버튼 누를 때마다 숫자 1 증가
                currentNumDisplay.textContent = currentNum; // 숫자 표시 업데이트
                if (animationTimeout) clearTimeout(animationTimeout); // 수정: 기존 애니메이션 취소
                messageDiv.classList.remove('updated', 'success', 'failure'); // 수정: 이전 클래스 제거
                messageDiv.classList.add('updated', 'success'); // 수정: 성공 시 초록 outline 클래스 추가
                animationTimeout = setTimeout(() => messageDiv.classList.remove('updated', 'success'), 2000); // 수정: setTimeout ID 저장 및 2초 후 클래스 제거
            } else {
                messageDiv.innerText = '복사 실패'; // 수정: 실패 메시지 표시
                if (animationTimeout) clearTimeout(animationTimeout); // 수정: 기존 애니메이션 취소
                messageDiv.classList.remove('updated', 'success', 'failure'); // 수정: 이전 클래스 제거
                messageDiv.classList.add('updated', 'failure'); // 수정: 실패 시 빨강 outline 클래스 추가
                animationTimeout = setTimeout(() => messageDiv.classList.remove('updated', 'failure'), 2000); // 수정: setTimeout ID 저장 및 2초 후 클래스 제거
            }
        });

        // 숫자 내리기 버튼
        decreaseBtn.addEventListener('click', () => {
            if (currentNum > 1) { // 최소 1로 제한
                currentNum--;
                currentNumDisplay.textContent = currentNum;
            }
        });

        // 숫자 올리기 버튼
        increaseBtn.addEventListener('click', () => {
            currentNum++;
            currentNumDisplay.textContent = currentNum;
        });
    </script>
</body>
</html>
